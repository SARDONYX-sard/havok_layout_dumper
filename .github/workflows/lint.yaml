name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # .clang-format / .clang-tidy need LLVM >= 22 (list form `Checks`, BinPackLongBracedList, ...)
      - name: Install clang-format / clang-tidy
        run: python -m pip install clang-format==22.1.3 clang-tidy==22.1.8

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.6"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: ${{ runner.os }}-xmake-lint-cache-

      - name: Configure
        run: xmake f -p windows -a x64 -m releasedbg -y

      - name: Lint # clang-format --dry-run + clang-tidy
        run: xmake lint
