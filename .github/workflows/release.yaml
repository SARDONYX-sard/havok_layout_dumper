name: Release

on:
  push:
    tags:
      - "*"

jobs:
  # Test + `xmake package` per OS: build/packages/<target>-<version>-<plat>-<arch>.zip
  #   windows: xSE plugins + hkdump.exe, linux / macos: hkdump
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            targets: "" # all default targets
          - os: ubuntu-24.04 # C++23 <print> needs GCC 14
            targets: hkdump
          - os: macos-latest # Apple clang (Xcode 16+)
            targets: hkdump

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-xmake # xmake + package cache + configure (GCC 14 on Linux)

      - name: Test
        run: xmake test -y

      - name: Package
        run: xmake package -y ${{ matrix.targets }}

      # transit only: download-artifact unpacks this layer again in the release job
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ runner.os }}
          path: build/packages/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --repo "${{ github.repository }}" --generate-notes
