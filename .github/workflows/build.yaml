name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.6"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: ${{ runner.os }}-xmake-build-cache-

      - name: Configure
        run: xmake f -p windows -a x64 -m releasedbg -y

      - name: Package # build/packages/<plugin>-<version>.zip
        run: xmake package -y

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: build/packages/*.zip
