name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # .clang-format / .clang-tidy need LLVM >= 22 (list form `Checks`, BinPackLongBracedList, ...)
      - name: Install clang-format / clang-tidy
        run: python -m pip install clang-format==22.1.3 clang-tidy==22.1.8

      - uses: ./.github/actions/setup-xmake # xmake + package cache + configure (GCC 14 on Linux)
        with:
          configure: -a x64

      - name: Lint # clang-format --dry-run + clang-tidy
        run: xmake lint
